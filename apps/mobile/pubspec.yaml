name: chat_app
description: Realtime messaging mobile client.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  socket_io_client: ^3.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/art/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand/quicksand-400.ttf
          weight: 400
        - asset: assets/fonts/quicksand/quicksand-500.ttf
          weight: 500
        - asset: assets/fonts/quicksand/quicksand-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/nunito-400.ttf
          weight: 400
        - asset: assets/fonts/nunito/nunito-600.ttf
          weight: 600
        - asset: assets/fonts/nunito/nunito-700.ttf
          weight: 700
        - asset: assets/fonts/nunito/nunito-800.ttf
          weight: 800
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
