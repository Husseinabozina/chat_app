name: chat_app
description: Realtime messaging mobile client.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  socket_io_client: ^3.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
