name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - master
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pubspec-lock
          path: apps/mobile/pubspec.lock
          if-no-files-found: error

      - name: Check formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
