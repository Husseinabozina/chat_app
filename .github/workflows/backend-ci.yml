name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - master
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, typecheck, build, migrate, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chat_app_test
          POSTGRES_USER: chat_app
          POSTGRES_PASSWORD: chat_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_app -d chat_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chat_app:chat_app@127.0.0.1:5432/chat_app_test
      ACCESS_TOKEN_SECRET: ci-only-secret-with-more-than-32-characters
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit resolved lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
          else
            git commit -m "chore(backend): lock resolved dependencies"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Check formatting
        run: |
          npm run format
          git diff --exit-code -- src test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run migrations
        run: node dist/database/migrate.js

      - name: Verify Argon2 runtime
        run: node -e "const argon2 = require('argon2'); console.log('argon2 runtime ok:', typeof argon2.hash)"

      - name: Verify application module import
        run: npx tsx -e "import('./src/app.module.ts').then(() => console.log('app module import ok')).catch((error) => { console.error(error); process.exit(1); })"

      - name: Test
        run: node --import tsx --test --test-isolation=none --test-reporter=tap test/auth.e2e.test.ts
