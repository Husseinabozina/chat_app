<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Chat App — Good chats. Better connections.</title><desc id="desc">Abstract pastel portfolio cover illustrating the product's approved design direction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#f6e3eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#684459" flood-opacity=".17"/></filter></defs><rect width="1200" height="590" rx="28" fill="url(#bg)"/><circle cx="915" cy="285" r="238" fill="#fadfe4"/><circle cx="1088" cy="482" r="130" fill="#e9e4f3"/><g fill="#9d7ba2" font-family="Arial,sans-serif" font-weight="700"><text x="79" y="85" font-size="23">✳ chat.app <tspan font-size="14" fill="#b38b99"> / a product in progress</tspan></text><text x="79" y="248" font-size="74" fill="#332c3b">Good chats.</text><text x="79" y="337" font-size="74" fill="#c46583">Better connections.</text><text x="79" y="402" font-size="22" font-weight="400" fill="#796d79">A thoughtful messenger built with Flutter and NestJS.</text><text x="79" y="453" font-size="18" font-weight="400" fill="#927d88">Design concept, not a released mobile build</text></g><g filter="url(#s)" transform="translate(822 71) rotate(8 145 232)"><rect width="282" height="470" rx="36" fill="#332b38"/><rect x="7" y="7" width="268" height="456" rx="31" fill="#fffefb"/><path d="M7 40Q7 7 40 7H242Q275 7 275 40V171Q130 215 7 178Z" fill="#fce6e5"/><rect x="100" y="12" width="80" height="16" rx="8" fill="#332b38"/><text x="24" y="78" font-family="Arial" font-size="10" fill="#a47a89">Your space</text><text x="24" y="119" font-family="Arial" font-size="35" font-weight="700" fill="#332c3b">Chats<tspan fill="#c46583">.</tspan></text><rect x="25" y="183" width="232" height="34" rx="12" fill="#f5eef0"/><text x="43" y="205" font-family="Arial" font-size="11" fill="#aaa0a5">⌕   Search conversations</text><g font-family="Arial" font-size="12" fill="#453843"><circle cx="46" cy="265" r="20" fill="#f0c9ce"/><text x="41" y="270">S</text><text x="77" y="261" font-weight="700">Sam</text><text x="77" y="279" font-size="10" fill="#9d929c">That sounds amazing!</text><circle cx="46" cy="331" r="20" fill="#e4d8f3"/><text x="41" y="335">A</text><text x="77" y="328" font-weight="700">Alex</text><text x="77" y="346" font-size="10" fill="#9d929c">See you tomorrow</text><circle cx="46" cy="398" r="20" fill="#e0eede"/><text x="41" y="402">M</text><text x="77" y="395" font-weight="700">Morgan</text><text x="77" y="412" font-size="10" fill="#9d929c">Perfect, thank you!</text></g></g><text x="1156" y="560" font-family="Arial" font-size="14" text-anchor="end" fill="#987c8f">UI direction / illustrative</text></svg>